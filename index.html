<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣告成效報表產生器｜自訂版 v6</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2F4F6;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#1F2733}
.box{width:min(560px,calc(100% - 40px));background:#fff;border:1px solid #DDE3E9;border-radius:12px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
h1{font-size:20px;margin:0 0 12px} p{font-size:14px;color:#5C6B7A;line-height:1.7;margin:0} .error{margin-top:16px;color:#C0392B;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<div class="box"><h1>廣告成效報表產生器</h1><p id="status">正在載入報表工具…</p><div id="error" class="error"></div></div>
<script>
(async function() {
  const SOURCE = "https://raw.githubusercontent.com/denny1463-afk/ad-report-generator/main/index.html";
  const PATCHES = [{"old": "      add(byAge, rec.age, rec);\n    }\n    return { byAdDate, byAdset, byGender, byAge };", "new": "      add(byAge, rec.age, rec);\n    }\n\n    // 年齡若含 Unknown／未知，將其數據併入一個有效年齡層，避免報表另外顯示 Unknown 列。\n    const ageUnknownKeys = [...byAge.keys()].filter(k => /^(unknown|未知)$/i.test(String(k).trim()));\n    if (ageUnknownKeys.length) {\n      const targetAgeKey = [...byAge.keys()]\n        .filter(k => !ageUnknownKeys.includes(k))\n        .sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true }))[0];\n      if (targetAgeKey) {\n        const target = byAge.get(targetAgeKey);\n        for (const uk of ageUnknownKeys) {\n          const src = byAge.get(uk);\n          if (!src) continue;\n          target.spend += src.spend;\n          for (const k in src.values) target.values[k] = (target.values[k] || 0) + src.values[k];\n          byAge.delete(uk);\n        }\n      }\n    }\n    return { byAdDate, byAdset, byGender, byAge };", "label": "年齡 Unknown 合併"}, {"old": "  const DKBLUE = 'FF1F497D', YELLOW = 'FFFFFF00', WHITE = 'FFFFFFFF', BLACK = 'FF000000', RED = 'FFFF0000', GREY = 'FF808080';", "new": "  const DKBLUE = 'FF44546A', YELLOW = 'FFFFFF00', WHITE = 'FFFFFFFF', BLACK = 'FF000000', RED = 'FFFF0000', GREY = 'FFE7E6E6';", "label": "報表主色與反灰色"}, {"old": "      ws.getColumn(cc).width = Math.max(10.5, Math.min(30, (colMax[cc] || 0) + 1.5));", "new": "      ws.getColumn(cc).width = Math.max(12.5, Math.min(32, (colMax[cc] || 0) + 2.5));", "label": "指標欄位間距"}, {"old": "<label class=\"ck\"><input type=\"checkbox\" id=\"secInterest\" checked>興趣群組(廣告組合)</label>", "new": "<label class=\"ck\"><input type=\"checkbox\" id=\"secInterest\" checked>受眾(廣告組合)</label>", "label": "網站受眾名稱"}, {"old": "      ['interest', '興趣群組', agg.byAdset, parsed.adsets],", "new": "      ['interest', '受眾', agg.byAdset, parsed.adsets],", "label": "報表受眾名稱"}, {"old": "    CPLC: { unitLabel: 'Link CPC', planLabel: '預計連結點擊次數', planExpr: 'B3/B5',\n      ratio: { top: '點擊率', num: 'linkClicks', den: 'impressions' },", "new": "    CPLC: { unitLabel: 'Link CPC', planLabel: '預計連結點擊次數', planExpr: 'B3/B5',\n      ratio: { top: 'LCTR', num: 'linkClicks', den: 'impressions' },", "label": "CPLC LCTR"}, {"old": "    set(rTot + 1, 1, { value: '總預算', font: { bold: true }, fill: fill(YELLOW), border: bd('medium', null, 'medium', 'thin') });\n    set(rTot + 1, 2, { formula: 'B3', numFmt: FMT.fee, font: { bold: true, color: { argb: RED } }, fill: fill(YELLOW), border: bd('medium', null, 'thin', 'medium'), h: 'center' });\n    set(rTot + 2, 1, { value: '總執行率', font: { bold: true }, fill: fill(YELLOW), border: bd('thin', 'medium', 'medium', 'thin') });\n    set(rTot + 2, 2, { formula: ifErr(`${cellFor('__fee', dStart)}${rTot}/B${rTot + 1}`), numFmt: FMT.ratio, font: { bold: true, color: { argb: RED } }, fill: fill(YELLOW), border: bd('thin', 'medium', 'thin', 'medium'), h: 'center' });", "new": "    // 總預算／總執行率：\n    // 整體總表區塊（A 到整體指標最後一欄）維持黃色；\n    // 後方各素材區塊同兩列改為淡綠色。\n    const rBudget = rTot + 1, rExec = rTot + 2;\n    const summaryLastCol = dStart + groupW - 1;\n    const PALEGREEN = 'FFE2F0D9';\n\n    // 整體總表：黃色\n    for (let c = 1; c <= summaryLastCol; c++) {\n      set(rBudget, c, {\n        fill: fill(YELLOW),\n        border: bd('medium', 'thin', c === 1 ? 'medium' : 'thin', c === summaryLastCol ? 'medium' : 'thin')\n      });\n      set(rExec, c, {\n        fill: fill(YELLOW),\n        border: bd('thin', 'medium', c === 1 ? 'medium' : 'thin', c === summaryLastCol ? 'medium' : 'thin')\n      });\n    }\n\n    // 素材區：淡綠色\n    for (let c = summaryLastCol + 1; c <= lastCol; c++) {\n      set(rBudget, c, {\n        fill: fill(PALEGREEN),\n        border: bd('medium', 'thin', boundaries.has(c) ? 'medium' : 'thin', c === lastCol ? 'medium' : 'thin')\n      });\n      set(rExec, c, {\n        fill: fill(PALEGREEN),\n        border: bd('thin', 'medium', boundaries.has(c) ? 'medium' : 'thin', c === lastCol ? 'medium' : 'thin')\n      });\n    }\n\n    // 整體總表區塊左側標題、最右側數值\n    set(rBudget, 1, {\n      value: '總預算',\n      font: { bold: true },\n      fill: fill(YELLOW),\n      border: bd('medium', 'thin', 'medium', 'thin'),\n      h: 'left'\n    });\n    set(rBudget, summaryLastCol, {\n      formula: 'B3',\n      numFmt: FMT.fee,\n      font: { bold: true, color: { argb: RED } },\n      fill: fill(YELLOW),\n      border: bd('medium', 'thin', 'thin', 'medium'),\n      h: 'right'\n    });\n\n    set(rExec, 1, {\n      value: '總執行率',\n      font: { bold: true },\n      fill: fill(YELLOW),\n      border: bd('thin', 'medium', 'medium', 'thin'),\n      h: 'left'\n    });\n    set(rExec, summaryLastCol, {\n      formula: ifErr(`${cellFor('__fee', dStart)}${rTot}/B3`),\n      numFmt: FMT.ratio,\n      font: { bold: true, color: { argb: RED } },\n      fill: fill(YELLOW),\n      border: bd('thin', 'medium', 'thin', 'medium'),\n      h: 'right'\n    });\n\n    // 黃色區塊標題橫向合併，但保留最後一欄給數值\n    if (summaryLastCol > 2) {\n      ws.mergeCells(rBudget, 1, rBudget, summaryLastCol - 1);\n      ws.mergeCells(rExec, 1, rExec, summaryLastCol - 1);\n    }", "label": "總預算與總執行率"}];
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  try {
    const res = await fetch(SOURCE, {cache:"no-store"});
    if (!res.ok) throw new Error("無法讀取原始網站程式（HTTP " + res.status + "）");
    let s = await res.text();

    for (const p of PATCHES) {
      if (!s.includes(p.old)) throw new Error("找不到修改位置：" + p.label + "。原網站程式可能已更新。");
      s = s.replace(p.old, p.new);
    }

    s = s.replace("<title>廣告成效報表產生器</title>","<title>廣告成效報表產生器｜自訂版 v6</title>");
    document.open();
    document.write(s);
    document.close();
  } catch (err) {
    console.error(err);
    status.textContent = "載入失敗";
    errorBox.textContent = err.message + "\n\n把這個錯誤畫面截給我，我可以直接修正。";
  }
})();
</script>

<script>
(function () {
  function deepClone(obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  }
  function cellText(v) {
    if (v == null) return '';
    if (typeof v === 'object') {
      if (v.text) return String(v.text);
      if (Array.isArray(v.richText)) return v.richText.map(x => x.text || '').join('');
      if (v.result != null) return String(v.result);
    }
    return String(v);
  }
  function colLetter(n) {
    let s = '';
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }
  function copyStyle(src, dst) {
    dst.style = deepClone(src.style || {});
    if (src.numFmt) dst.numFmt = src.numFmt;
    if (src.font) dst.font = deepClone(src.font);
    if (src.fill) dst.fill = deepClone(src.fill);
    if (src.border) dst.border = deepClone(src.border);
    if (src.alignment) dst.alignment = deepClone(src.alignment);
  }
  function renameReachHeaders(ws) {
    ws.eachRow((row) => {
      row.eachCell({ includeEmpty: false }, (cell) => {
        if (cell.value === '每日觸及人數') cell.value = '觸及人數';
      });
    });
  }
  function fixImageAspect(wb, ws) {
    try {
      const imgs = ws.getImages ? ws.getImages() : [];
      const mediaList = (wb.model && wb.model.media) || [];
      imgs.forEach((img) => {
        const range = img.range || img;
        const media = mediaList.find(m => m.index === img.imageId) || {};
        const ow = media.width || (media.ext && media.ext.width) || 416;
        const oh = media.height || (media.ext && media.ext.height) || 416;
        if (!range || !range.tl || !ow || !oh) return;
        const maxW = 170, maxH = 220;
        const scale = Math.min(maxW / ow, maxH / oh, 1);
        range.ext = { width: Math.round(ow * scale), height: Math.round(oh * scale) };
        delete range.br;
        range.editAs = 'oneCell';
        range.tl = { col: range.tl.col, row: range.tl.row, offsetX: 4, offsetY: 4 };
      });
    } catch (e) {
      console.warn('fixImageAspect failed', e);
    }
  }
  function addCPMFrequency(ws) {
    const headerRow = 9, subRow = 10;
    const maxCol = ws.columnCount || ws.actualColumnCount || 200;
    let cpmCols = [];
    for (let c = 1; c <= maxCol; c++) {
      if (cellText(ws.getCell(headerRow, c).value) === 'CPM' || cellText(ws.getCell(subRow, c).value) === 'CPM') {
        cpmCols.push(c);
      }
    }
    if (!cpmCols.length) return;

    // 從右往左插入欄位，避免欄位位移影響尚未處理的 CPM 欄
    for (let i = cpmCols.length - 1; i >= 0; i--) {
      const c = cpmCols[i];
      ws.spliceColumns(c + 1, 0, []);
      ws.getColumn(c + 1).width = Math.max(ws.getColumn(c).width || 10, 10);

      copyStyle(ws.getCell(headerRow, c), ws.getCell(headerRow, c + 1));
      ws.getCell(headerRow, c + 1).value = '頻次';
      copyStyle(ws.getCell(subRow, c), ws.getCell(subRow, c + 1));
      ws.getCell(subRow, c + 1).value = null;
      try { ws.mergeCells(headerRow, c + 1, subRow, c + 1); } catch (e) {}

      for (let r = 11; r <= ws.rowCount; r++) {
        const label = cellText(ws.getCell(r, 1).value).trim();
        const freqCell = ws.getCell(r, c + 1);
        copyStyle(ws.getCell(r, c), freqCell);

        const impCol = c - 9;
        const reachCol = c - 8;

        if (label === '素材總計' || label === '總計' || label === '總預算' || label === '總執行率') {
          freqCell.value = null;
        } else if (impCol > 0 && reachCol > 0 && ws.getCell(r, impCol).value != null) {
          freqCell.value = { formula: `IFERROR(${colLetter(impCol)}${r}/${colLetter(reachCol)}${r},0)` };
          freqCell.numFmt = '0.00';
        }
      }
    }

    // 觸及人數的總計不加總：將所有總計列中的 reach 欄留白
    const finalCpmCols = [];
    for (let c = 1; c <= ws.columnCount; c++) {
      if (cellText(ws.getCell(headerRow, c).value) === 'CPM' || cellText(ws.getCell(subRow, c).value) === 'CPM') {
        finalCpmCols.push(c);
      }
    }
    for (let r = 1; r <= ws.rowCount; r++) {
      const label = cellText(ws.getCell(r, 1).value).trim();
      if (label === '素材總計' || label === '總計') {
        finalCpmCols.forEach((c) => {
          const reachCol = c - 8;
          if (reachCol > 0) ws.getCell(r, reachCol).value = null;
        });
      }
    }
  }
  function findConfigArg(args) {
    return args.find(a => a && typeof a === 'object' && a.type) || {};
  }
  async function postProcessWorkbook(wb, config) {
    if (!wb || !wb.worksheets || !wb.worksheets.length) return wb;
    wb.worksheets.forEach((ws) => {
      renameReachHeaders(ws);
      fixImageAspect(wb, ws);
      if (config && config.type === 'CPM') addCPMFrequency(ws);
    });
    return wb;
  }
  window.addEventListener('load', function () {
    try {
      if (!window.ReportGen || !ReportGen.buildWorkbook || window.__cfCustomPatchDone) return;
      const oldBuildWorkbook = ReportGen.buildWorkbook.bind(ReportGen);
      ReportGen.buildWorkbook = async function (...args) {
        const wb = await oldBuildWorkbook(...args);
        const config = findConfigArg(args);
        return await postProcessWorkbook(wb, config);
      };
      window.__cfCustomPatchDone = true;
      console.log('Custom workbook patch applied');
    } catch (e) {
      console.error('Custom workbook patch failed', e);
    }
  });
})();
</script>

</body>
