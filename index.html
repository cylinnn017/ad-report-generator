<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣告成效報表產生器</title>
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F2F4F6;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    color:#1F2733;
  }
  .loader{
    width:min(520px,calc(100% - 40px));
    background:#fff;
    border:1px solid #DDE3E9;
    border-radius:12px;
    padding:28px;
    box-shadow:0 8px 28px rgba(0,0,0,.06);
  }
  h1{font-size:20px;margin:0 0 12px}
  p{font-size:14px;color:#5C6B7A;line-height:1.7;margin:0}
  .error{margin-top:16px;color:#C0392B;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<div class="loader">
  <h1>廣告成效報表產生器</h1>
  <p id="status">正在載入報表工具…</p>
  <div id="error" class="error"></div>
</div>

<script>
(async function () {
  const SOURCE = 'https://raw.githubusercontent.com/denny1463-afk/ad-report-generator/main/index.html';
  const status = document.getElementById('status');
  const errorBox = document.getElementById('error');

  function patchOnce(source, oldText, newText, label) {
    if (!source.includes(oldText)) {
      throw new Error('找不到修改位置：' + label + '。原網站程式可能已更新。');
    }
    return source.replace(oldText, newText);
  }

  try {
    status.textContent = '正在讀取原始報表工具…';
    const res = await fetch(SOURCE, { cache: 'no-store' });
    if (!res.ok) throw new Error('無法讀取原始網站程式（HTTP ' + res.status + '）');
    let s = await res.text();

    status.textContent = '正在套用自訂報表設定…';

    // ① 年齡 Unknown / 未知
    s = patchOnce(
      s,
`      add(byAge, rec.age, rec);
    }
    return { byAdDate, byAdset, byGender, byAge };`,
`      add(byAge, rec.age, rec);
    }

    // 年齡若含 Unknown／未知，將其數據併入一個有效年齡層，避免報表另外顯示 Unknown 列。
    const ageUnknownKeys = [...byAge.keys()].filter(k => /^(unknown|未知)$/i.test(String(k).trim()));
    if (ageUnknownKeys.length) {
      const targetAgeKey = [...byAge.keys()]
        .filter(k => !ageUnknownKeys.includes(k))
        .sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true }))[0];
      if (targetAgeKey) {
        const target = byAge.get(targetAgeKey);
        for (const uk of ageUnknownKeys) {
          const src = byAge.get(uk);
          if (!src) continue;
          target.spend += src.spend;
          for (const k in src.values) target.values[k] = (target.values[k] || 0) + src.values[k];
          byAge.delete(uk);
        }
      }
    }
    return { byAdDate, byAdset, byGender, byAge };`,
      '年齡 Unknown 合併'
    );

    // ② 顏色
    s = patchOnce(
      s,
`  const DKBLUE = 'FF1F497D', YELLOW = 'FFFFFF00', WHITE = 'FFFFFFFF', BLACK = 'FF000000', RED = 'FFFF0000', GREY = 'FF808080';`,
`  const DKBLUE = 'FF44546A', YELLOW = 'FFFFFF00', WHITE = 'FFFFFFFF', BLACK = 'FF000000', RED = 'FFFF0000', GREY = 'FFE7E6E6';`,
      '報表主色與反灰色'
    );

    // ③ 欄寬
    s = patchOnce(
      s,
`      ws.getColumn(cc).width = Math.max(10.5, Math.min(30, (colMax[cc] || 0) + 1.5));`,
`      ws.getColumn(cc).width = Math.max(12.5, Math.min(32, (colMax[cc] || 0) + 2.5));`,
      '指標欄位間距'
    );

    // ④ 受眾名稱
    s = patchOnce(
      s,
`<label class="ck"><input type="checkbox" id="secInterest" checked>興趣群組(廣告組合)</label>`,
`<label class="ck"><input type="checkbox" id="secInterest" checked>受眾(廣告組合)</label>`,
      '受眾設定名稱'
    );

    s = patchOnce(
      s,
`      ['interest', '興趣群組', agg.byAdset, parsed.adsets],`,
`      ['interest', '受眾', agg.byAdset, parsed.adsets],`,
      '受眾報表名稱'
    );

    // ⑤ CPLC 點擊率 → LCTR
    s = patchOnce(
      s,
`    CPLC: { unitLabel: 'Link CPC', planLabel: '預計連結點擊次數', planExpr: 'B3/B5',
      ratio: { top: '點擊率', num: 'linkClicks', den: 'impressions' },`,
`    CPLC: { unitLabel: 'Link CPC', planLabel: '預計連結點擊次數', planExpr: 'B3/B5',
      ratio: { top: 'LCTR', num: 'linkClicks', den: 'impressions' },`,
      'CPLC LCTR'
    );

    // ⑥ 總預算 / 總執行率
    // 注意：下方公式中的 ${...} 必須保留給「原始報表程式」執行，所以使用 \${...} 避免本層提前展開。
    s = patchOnce(
      s,
`    set(rTot + 1, 1, { value: '總預算', font: { bold: true }, fill: fill(YELLOW), border: bd('medium', null, 'medium', 'thin') });
    set(rTot + 1, 2, { formula: 'B3', numFmt: FMT.fee, font: { bold: true, color: { argb: RED } }, fill: fill(YELLOW), border: bd('medium', null, 'thin', 'medium'), h: 'center' });
    set(rTot + 2, 1, { value: '總執行率', font: { bold: true }, fill: fill(YELLOW), border: bd('thin', 'medium', 'medium', 'thin') });
    set(rTot + 2, 2, { formula: ifErr(\`${cellFor('__fee', dStart)}${rTot}/B${rTot + 1}\`), numFmt: FMT.ratio, font: { bold: true, color: { argb: RED } }, fill: fill(YELLOW), border: bd('thin', 'medium', 'thin', 'medium'), h: 'center' });`,
`    const rBudget = rTot + 1, rExec = rTot + 2;

    for (let c = 1; c <= lastCol; c++) {
      set(rBudget, c, {
        fill: fill(YELLOW),
        border: bd('medium', 'thin', c === 1 ? 'medium' : 'thin', c === lastCol ? 'medium' : 'thin')
      });
      set(rExec, c, {
        fill: fill(YELLOW),
        border: bd('thin', 'medium', c === 1 ? 'medium' : 'thin', c === lastCol ? 'medium' : 'thin')
      });
    }

    set(rBudget, 1, {
      value: '總預算',
      font: { bold: true },
      fill: fill(YELLOW),
      border: bd('medium', 'thin', 'medium', 'thin'),
      h: 'left'
    });

    set(rBudget, lastCol, {
      formula: 'B3',
      numFmt: FMT.fee,
      font: { bold: true, color: { argb: RED } },
      fill: fill(YELLOW),
      border: bd('medium', 'thin', 'thin', 'medium'),
      h: 'right'
    });

    set(rExec, 1, {
      value: '總執行率',
      font: { bold: true },
      fill: fill(YELLOW),
      border: bd('thin', 'medium', 'medium', 'thin'),
      h: 'left'
    });

    set(rExec, lastCol, {
      formula: ifErr(\`\${cellFor('__fee', dStart)}\${rTot}/B3\`),
      numFmt: FMT.ratio,
      font: { bold: true, color: { argb: RED } },
      fill: fill(YELLOW),
      border: bd('thin', 'medium', 'thin', 'medium'),
      h: 'right'
    });

    if (lastCol > 2) {
      ws.mergeCells(rBudget, 1, rBudget, lastCol - 1);
      ws.mergeCells(rExec, 1, rExec, lastCol - 1);
    }`,
      '總預算與總執行率'
    );

    s = s.replace(
      '<title>廣告成效報表產生器</title>',
      '<title>廣告成效報表產生器｜自訂版</title>'
    );

    status.textContent = '載入完成，正在啟動…';
    document.open();
    document.write(s);
    document.close();

  } catch (err) {
    console.error(err);
    status.textContent = '載入失敗';
    errorBox.textContent =
      err.message +
      '\n\n請確認網路連線正常；若原網站程式有更新，我可以再幫你同步新版。';
  }
})();
</script>
</body>
</html>
