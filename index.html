ULL_H - GAP;                      // 高度撐好撐滿(198px)\n      let w = h * iw / ih;\n      if (w > boxW) { w = boxW; h = w * ih / iw; }  // 過寬的圖以三欄框寬為限\n      // 右下角錨點:費用欄右緣 = 下一欄左緣;底部 = 第8列內距頂 (ROW8_PX-GAP) px\n      const br = { nativeCol: blockEnd, nativeColOff: 0, nativeRow: 7, nativeRowOff: Math.round((ROW8_PX - GAP) * EMU) };\n      // 左上角:自費用欄右緣往左回推 w、自底部往上回推 h(以模型估算)\n      let remain = w, tlCol = blockEnd;\n      while (tlCol > 1 && remain > colPx(tlCol)) { remain -= colPx(tlCol); tlCol--; }\n      const offX = Math.max(0, colPx(tlCol) - remain);", "new": "      const iw = img.width || 400, ih = img.height || 600;\n      const RIGHT_PAD = 18;                      // 與下一個素材區塊保留安全距離\n      let h = FULL_H - GAP;                      // 高度撐好撐滿(198px)\n      let w = h * iw / ih;\n      const maxBoxW = Math.max(40, boxW - RIGHT_PAD);\n      if (w > maxBoxW) { w = maxBoxW; h = w * ih / iw; }  // 保持原圖比例，不超出自己的素材區塊\n      // 右下角錨點保留供既有定位計算參考\n      const br = { nativeCol: blockEnd, nativeColOff: 0, nativeRow: 7, nativeRowOff: Math.round((ROW8_PX - GAP) * EMU) };\n      // 左上角:右側預留 RIGHT_PAD，避免圖片貼到下一支素材名稱\n      let remain = w + RIGHT_PAD, tlCol = blockEnd;\n      while (tlCol > 1 && remain > colPx(tlCol)) { remain -= colPx(tlCol); tlCol--; }\n      const offX = Math.max(0, colPx(tlCol) - remain);"}, {"label": "摘要新增一列後區段位移", "old": "    let rs = rTot + 4;", "new": "    let rs = rTot + 5;"}, {"label": "走期區塊加ID", "old": "      <fieldset>\n        <legend>走期</legend>", "new": "      <fieldset id=\"globalPeriod\">\n        <legend>走期</legend>"}, {"label": "單一分頁名稱欄位", "old": "          <div class=\"field\"><label for=\"fName\">名稱</label><input type=\"text\" id=\"fName\" placeholder=\"例:OTV_Post1_Video\"></div>\n          <div class=\"field\"><label for=\"fBudget\">預算 (TWD)</label>", "new": "          <div class=\"field\"><label for=\"fName\">名稱</label><input type=\"text\" id=\"fName\" placeholder=\"例:OTV_Post1_Video\"></div>\n          <div class=\"field\"><label for=\"fSheetName\">Excel 分頁命名（選填）</label><input type=\"text\" id=\"fSheetName\" placeholder=\"未填則使用報表類型\"></div>\n          <div class=\"field\"><label for=\"fBudget\">預算 (TWD)</label>"}, {"label": "點擊欄位順序", "old": "    { key: 'linkClicks',  top: '連結', bottom: '點擊次數', match: n => n.includes('連結點擊次數') },\n    { key: 'clicks',      top: '廣告', bottom: '點擊次數', match: n => n.includes('點擊次數') && n.includes('全部') },", "new": "    { key: 'clicks',      top: '廣告', bottom: '點擊次數', match: n => n.includes('點擊次數') && n.includes('全部') },\n    { key: 'linkClicks',  top: '連結', bottom: '點擊次數', match: n => n.includes('連結點擊次數') },"}, {"label": "CPLC優先順序", "old": "    CPLC: ['impressions', 'linkClicks'],", "new": "    CPLC: ['impressions', 'clicks', 'linkClicks'],"}, {"label": "單一設定加入分頁名稱", "old": "      name: $('fName').value.trim(),\n      budget: parseFloat($('fBudget').value) || 0,", "new": "      name: $('fName').value.trim(),\n      sheetName: $('fSheetName').value.trim(),\n      budget: parseFloat($('fBudget').value) || 0,"}, {"label": "單一工作表命名", "old": "      warnings = buildSheet(wb, ExcelJS, parsed, config, config.type);", "new": "      const usedNames = new Set();\n      warnings = buildSheet(wb, ExcelJS, parsed, config, sheetName(config.sheetName || config.type, usedNames));"}, {"label": "儲存設定升版", "old": "      v: 1, savedAt: new Date().toISOString().slice(0, 10),\n      composite: cfg.composite,\n      mainType: document.querySelector('input[name=rtype]:checked').value,\n      single: { name: $('fName').value.trim(), budget: $('fBudget').value, unitPrice: $('fUnit').value },", "new": "      v: 2, savedAt: new Date().toISOString().slice(0, 10),\n      composite: cfg.composite,\n      mainType: document.querySelector('input[name=rtype]:checked').value,\n      single: {\n        name: $('fName').value.trim(),\n        sheetName: $('fSheetName').value.trim(),\n        budget: $('fBudget').value,\n        unitPrice: $('fUnit').value\n      },"}, {"label": "還原單一分頁名稱", "old": "    $('compositeChk').checked = !!cfg.composite;\n    if (cfg.mainType) { const r = document.querySelector(`input[name=rtype][value=${cfg.mainType}]`); if (r) r.checked = true; }\n    if (cfg.single) { $('fName').value = cfg.single.name || ''; $('fBudget').value = cfg.single.budget || ''; $('fUnit').value = cfg.single.unitPrice || ''; }", "new": "    $('compositeChk').checked = !!cfg.composite;\n    if (cfg.mainType) { const r = document.querySelector(`input[name=rtype][value=${cfg.mainType}]`); if (r) r.checked = true; }\n    if (cfg.single) {\n      $('fName').value = cfg.single.name || '';\n      $('fSheetName').value = cfg.single.sheetName || '';\n      $('fBudget').value = cfg.single.budget || '';\n      $('fUnit').value = cfg.single.unitPrice || '';\n    }"}, {"label": "總表不反灰", "old": "      // 日期欄:整日無資料則反灰\n      set(r, 1, dailyHasData\n        ? { value: keyToDate(day), numFmt: FMT.date, border: bd('thin', 'thin', ...vSide(1)) }\n        : { fill: fill(GREY), border: bd('thin', 'thin', ...vSide(1)) });", "new": "      // 日期欄：總表永遠顯示日期，不因整日無資料而反灰\n      set(r, 1, {\n        value: keyToDate(day),\n        numFmt: FMT.date,\n        border: bd('thin', 'thin', ...vSide(1))\n      });"}, {"label": "總表公式不反灰", "old": "      groupKeys.forEach((k, j) => {\n        const c = dStart + j, [l, rr] = vSide(c), border = bd('thin', 'thin', l, rr);\n        const greyFill = dailyHasData ? undefined : fill(GREY);\n        if (k === '__ratio') set(r, c, { formula: ifErr(`${cellFor(tc.ratio.num, dStart)}${r}/${cellFor(tc.ratio.den, dStart)}${r}`), numFmt: FMT.ratio, fill: greyFill, border });\n        else if (k === '__cost') set(r, c, { formula: ifErr(`${cellFor('__fee', dStart)}${r}/${cellFor(tc.cost.den, dStart)}${r}${tc.cost.perMille ? '*1000' : ''}`), numFmt: FMT.cost, fill: greyFill, border });\n        else if (k === '__frequency') set(r, c, { formula: ifErr(`${cellFor('impressions', dStart)}${r}/${cellFor('reach', dStart)}${r}`), numFmt: '0.00', fill: greyFill, border });\n        else if (!dailyHasData) set(r, c, { fill: fill(GREY), border });\n        else set(r, c, { formula: blocks.map(b => `${cellFor(k, b)}${r}`).join('+') || '0', numFmt: k === '__fee' ? FMT.fee : FMT.metric, border });\n      });", "new": "      groupKeys.forEach((k, j) => {\n        const c = dStart + j, [l, rr] = vSide(c), border = bd('thin', 'thin', l, rr);\n\n        // 整體總表永遠保留公式／日期，不做反灰\n        if (k === '__ratio') {\n          set(r, c, {\n            formula: `${cellFor(tc.ratio.num, dStart)}${r}/${cellFor(tc.ratio.den, dStart)}${r}`,\n            numFmt: FMT.ratio,\n            border\n          });\n        } else if (k === '__cost') {\n          set(r, c, {\n            formula: `${cellFor('__fee', dStart)}${r}/${cellFor(tc.cost.den, dStart)}${r}${tc.cost.perMille ? '*1000' : ''}`,\n            numFmt: FMT.cost,\n            border\n          });\n        } else if (k === '__frequency') {\n          set(r, c, {\n            formula: `${cellFor('impressions', dStart)}${r}/${cellFor('reach', dStart)}${r}`,\n            numFmt: '0.00',\n            border\n          });\n        } else {\n          set(r, c, {\n            formula: blocks.map(b => `${cellFor(k, b)}${r}`).join('+') || '0',\n            numFmt: k === '__fee' ? FMT.fee : FMT.metric,\n            border\n          });\n        }\n      });"}];
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  try {
    const res = await fetch(SOURCE, {cache:"no-store"});
    if (!res.ok) throw new Error("無法讀取原始網站程式（HTTP " + res.status + "）");
    let s = await res.text();

    for (const p of PATCHES) {
      if (!s.includes(p.old)) throw new Error("找不到修改位置：" + p.label + "。原網站程式可能已更新。");
      s = s.replace(p.old, p.new);
    }

    s = s.replace("<title>廣告成效報表產生器</title>","<title>廣告成效報表產生器｜自訂版 v19</title>");
    s = s.replace("Raw Data → 每日總表 + 素材數據 + 受眾彙總 · CPM / CPC / CPLC / CPV","Raw Data → 每日總表 + 素材數據 + 受眾彙總 · CPM / CPC / CPLC / CPV · v8");
    document.open();
    document.write(s);
    document.close();
  } catch (err) {
    console.error(err);
    status.textContent = "載入失敗";
    errorBox.textContent = err.message + "\n\n把這個錯誤畫面截給我，我可以直接修正。";
  }
})();
</script>

<script>
(function () {
  function deepClone(obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  }
  function cellText(v) {
    if (v == null) return '';
    if (typeof v === 'object') {
      if (v.text) return String(v.text);
      if (Array.isArray(v.richText)) return v.richText.map(x => x.text || '').join('');
      if (v.result != null) return String(v.result);
    }
    return String(v);
  }
  function colLetter(n) {
    let s = '';
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }
  function copyStyle(src, dst) {
    dst.style = deepClone(src.style || {});
    if (src.numFmt) dst.numFmt = src.numFmt;
    if (src.font) dst.font = deepClone(src.font);
    if (src.fill) dst.fill = deepClone(src.fill);
    if (src.border) dst.border = deepClone(src.border);
    if (src.alignment) dst.alignment = deepClone(src.alignment);
  }
  function renameReachHeaders(ws) {
    ws.eachRow((row) => {
      row.eachCell({ includeEmpty: false }, (cell) => {
        if (cell.value === '每日觸及人數') cell.value = '觸及人數';
      });
    });
  }
  function fixImageAspect(wb, ws) {
    try {
      const imgs = ws.getImages ? ws.getImages() : [];
      const mediaList = (wb.model && wb.model.media) || [];
      imgs.forEach((img) => {
        const range = img.range || img;
        const media = mediaList.find(m => m.index === img.imageId) || {};
        const ow = media.width || (media.ext && media.ext.width) || 416;
        const oh = media.height || (media.ext && media.ext.height) || 416;
        if (!range || !range.tl || !ow || !oh) return;
        const maxW = 170, maxH = 220;
        const scale = Math.min(maxW / ow, maxH / oh, 1);
        range.ext = { width: Math.round(ow * scale), height: Math.round(oh * scale) };
        delete range.br;
        range.editAs = 'oneCell';
        range.tl = { col: range.tl.col, row: range.tl.row, offsetX: 4, offsetY: 4 };
      });
    } catch (e) {
      console.warn('fixImageAspect failed', e);
    }
  }
  function addCPMFrequency(ws) {
    const headerRow = 9, subRow = 10;
    const maxCol = ws.columnCount || ws.actualColumnCount || 200;
    let cpmCols = [];
    for (let c = 1; c <= maxCol; c++) {
      if (cellText(ws.getCell(headerRow, c).value) === 'CPM' || cellText(ws.getCell(subRow, c).value) === 'CPM') {
        cpmCols.push(c);
      }
    }
    if (!cpmCols.length) return;

    // 從右往左插入欄位，避免欄位位移影響尚未處理的 CPM 欄
    for (let i = cpmCols.length - 1; i >= 0; i--) {
      const c = cpmCols[i];
      ws.spliceColumns(c + 1, 0, []);
      ws.getColumn(c + 1).width = Math.max(ws.getColumn(c).width || 10, 10);

      copyStyle(ws.getCell(headerRow, c), ws.getCell(headerRow, c + 1));
      ws.getCell(headerRow, c + 1).value = '頻次';
      copyStyle(ws.getCell(subRow, c), ws.getCell(subRow, c + 1));
      ws.getCell(subRow, c + 1).value = null;
      try { ws.mergeCells(headerRow, c + 1, subRow, c + 1); } catch (e) {}

      for (let r = 11; r <= ws.rowCount; r++) {
        const label = cellText(ws.getCell(r, 1).value).trim();
        const freqCell = ws.getCell(r, c + 1);
        copyStyle(ws.getCell(r, c), freqCell);

        const impCol = c - 9;
        const reachCol = c - 8;

        if (label === '素材總計' || label === '總計' || label === '總預算' || label === '總執行率') {
          freqCell.value = null;
        } else if (impCol > 0 && reachCol > 0 && ws.getCell(r, impCol).value != null) {
          freqCell.value = { formula: `IFERROR(${colLetter(impCol)}${r}/${colLetter(reachCol)}${r},0)` };
          freqCell.numFmt = '0.00';
        }
      }
    }

    // 觸及人數的總計不加總：將所有總計列中的 reach 欄留白
    const finalCpmCols = [];
    for (let c = 1; c <= ws.columnCount; c++) {
      if (cellText(ws.getCell(headerRow, c).value) === 'CPM' || cellText(ws.getCell(subRow, c).value) === 'CPM') {
        finalCpmCols.push(c);
      }
    }
    for (let r = 1; r <= ws.rowCount; r++) {
      const label = cellText(ws.getCell(r, 1).value).trim();
      if (label === '素材總計' || label === '總計') {
        finalCpmCols.forEach((c) => {
          const reachCol = c - 8;
          if (reachCol > 0) ws.getCell(r, reachCol).value = null;
        });
      }
    }
  }
  function findConfigArg(args) {
    return args.find(a => a && typeof a === 'object' && a.type) || {};
  }
  async function postProcessWorkbook(wb, config) {
    if (!wb || !wb.worksheets || !wb.worksheets.length) return wb;
    wb.worksheets.forEach((ws) => {
      renameReachHeaders(ws);
      fixImageAspect(wb, ws);
      if (config && config.type === 'CPM') addCPMFrequency(ws);
    });
    return wb;
  }
  window.addEventListener('load', function () {
    try {
      if (!window.ReportGen || !ReportGen.buildWorkbook || window.__cfCustomPatchDone) return;
      const oldBuildWorkbook = ReportGen.buildWorkbook.bind(ReportGen);
      ReportGen.buildWorkbook = async function (...args) {
        const wb = await oldBuildWorkbook(...args);
        const config = findConfigArg(args);
        return await postProcessWorkbook(wb, config);
      };
      window.__cfCustomPatchDone = true;
      console.log('Custom workbook patch applied');
    } catch (e) {
      console.error('Custom workbook patch failed', e);
    }
  });
})();
</script>
