\n    const pricingLabel = isCPAType && cfg.pricingMode === 'LINK_CPC' ? 'Link CPC' : tc.unitLabel;\n    $('unitLabel').textContent = pricingLabel + ' 單價';"}, {"label": "CPA計價事件", "old": "$('compositeChk').addEventListener('change', applyMode);", "new": "$('compositeChk').addEventListener('change', applyMode);\n$('fPricingMode').addEventListener('change', refresh);"}, {"label": "CPA頁面預設", "old": "function ensurePageInfo(pg) {\n  if (!pageInfoState[pg]) pageInfoState[pg] = { name: '', budget: '', unitPrice: '' };\n  return pageInfoState[pg];\n}", "new": "function ensurePageInfo(pg) {\n  if (!pageInfoState[pg]) pageInfoState[pg] = { name: '', budget: '', unitPrice: '', pricingMode: 'CPA' };\n  if (!pageInfoState[pg].pricingMode) pageInfoState[pg].pricingMode = 'CPA';\n  return pageInfoState[pg];\n}"}, {"label": "CPA頁面預設", "old": "    pageInfoState[t] = { name: '', budget: '', unitPrice: '' };", "new": "    pageInfoState[t] = { name: '', budget: '', unitPrice: '', pricingMode: 'CPA' };"}, {"label": "CPA複合基本資訊", "old": "        <div class=\"field\"><label>${tc.unitLabel} 單價</label><input type=\"number\" min=\"0\" step=\"0.01\" data-pi=\"${esc(page)}\" data-tf=\"unitPrice\" value=\"${esc(info.unitPrice)}\" placeholder=\"例:80\"></div>", "new": "        ${type === 'CPA' ? `<div class=\"field\"><label>計價方式</label><select data-pi=\"${esc(page)}\" data-tf=\"pricingMode\" style=\"width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:#fff\"><option value=\"CPA\" ${info.pricingMode !== 'LINK_CPC' ? 'selected' : ''}>CPA</option><option value=\"LINK_CPC\" ${info.pricingMode === 'LINK_CPC' ? 'selected' : ''}>Link CPC</option></select></div>` : ''}\n        <div class=\"field\"><label>${type === 'CPA' && info.pricingMode === 'LINK_CPC' ? 'Link CPC' : tc.unitLabel} 單價</label><input type=\"number\" min=\"0\" step=\"0.01\" data-pi=\"${esc(page)}\" data-tf=\"unitPrice\" value=\"${esc(info.unitPrice)}\" placeholder=\"例:80\"></div>"}, {"label": "CPA複合頁設定", "old": "    pageConfigs[page] = {\n      name: (info.name || '').trim(),\n      budget: parseFloat(info.budget) || 0,\n      unitPrice: parseFloat(info.unitPrice) || 0,\n    };", "new": "    pageConfigs[page] = {\n      name: (info.name || '').trim(),\n      pricingMode: info.pricingMode || 'CPA',\n      budget: parseFloat(info.budget) || 0,\n      unitPrice: parseFloat(info.unitPrice) || 0,\n    };"}, {"label": "CPA建表計價方式", "old": "    const tc = TYPE_CONFIG[config.type];\n    if (!tc) throw new Error('未知的報表類型: ' + config.type);", "new": "    let tc = TYPE_CONFIG[config.type];\n    if (!tc) throw new Error('未知的報表類型: ' + config.type);\n    if (config.type === 'CPA') {\n      tc = { ...tc };\n      if (config.pricingMode === 'LINK_CPC') {\n        tc.unitLabel = 'Link CPC';\n        tc.planLabel = '預計連結點擊次數';\n      } else {\n        tc.unitLabel = 'CPA';\n        tc.planLabel = '預計購買次數';\n      }\n    }"}, {"label": "CPA複合建表設定", "old": "          unitPrice: pageCfg.unitPrice != null ? pageCfg.unitPrice : config.unitPrice,\n          startDate: config.startDate,", "new": "          unitPrice: pageCfg.unitPrice != null ? pageCfg.unitPrice : config.unitPrice,\n          pricingMode: pageCfg.pricingMode || 'CPA',\n          startDate: config.startDate,"}, {"label": "CPA缺欄提示", "old": "  const need = new Set([tc.cost.den, tc.ratio.num, tc.ratio.den]);\n  const miss = [...need].filter(k => !avail.has(k));", "new": "  const need = new Set([tc.cost.den, tc.ratio.num, tc.ratio.den]);\n  if (t === 'CPA') ['linkClicks', 'purchaseValue'].forEach(k => need.add(k));\n  const miss = [...need].filter(k => !avail.has(k));"}, {"label": "CPA複合計價即時更新", "old": "$('typeInfoList').addEventListener('input', e => {\n  const pg = e.target.dataset.pi, f = e.target.dataset.tf;\n  if (pg && f) { ensurePageInfo(pg)[f] = e.target.value; refresh(); }\n});", "new": "$('typeInfoList').addEventListener('input', e => {\n  const pg = e.target.dataset.pi, f = e.target.dataset.tf;\n  if (pg && f) {\n    ensurePageInfo(pg)[f] = e.target.value;\n    if (f === 'pricingMode') renderTypeInfos();\n    refresh();\n  }\n});"}];
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  try {
    const res = await fetch(SOURCE, {cache:"no-store"});
    if (!res.ok) throw new Error("無法讀取原始網站程式（HTTP " + res.status + "）");
    let s = await res.text();

    for (const p of PATCHES) {
      if (!s.includes(p.old)) throw new Error("找不到修改位置：" + p.label + "。原網站程式可能已更新。");
      s = s.replace(p.old, () => p.new);
    }

    s = s.replace("<title>廣告成效報表產生器</title>","<title>廣告成效報表產生器｜自訂版 v24</title>");

    // 不再使用 document.write 直接執行整頁，避免 Script 執行順序不穩定。
    // 改成先建立 DOM，再依原始順序逐支執行 script：
    // XLSX → ExcelJS → ReportGen → UI。
    const parsedDoc = new DOMParser().parseFromString(s, "text/html");
    const scripts = [...parsedDoc.querySelectorAll("script")].map(el => ({
      src: el.getAttribute("src"),
      code: el.textContent || "",
      type: el.getAttribute("type") || ""
    }));

    parsedDoc.querySelectorAll("script").forEach(el => el.remove());

    document.documentElement.lang = parsedDoc.documentElement.lang || "zh-Hant";
    document.head.innerHTML = parsedDoc.head.innerHTML;
    document.body.innerHTML = parsedDoc.body.innerHTML;

    async function runScript(def) {
      if (def.type && def.type !== "text/javascript" && def.type !== "application/javascript") return;
      await new Promise((resolve, reject) => {
        const el = document.createElement("script");
        if (def.src) {
          el.src = def.src;
          el.async = false;
          el.onload = resolve;
          el.onerror = () => reject(new Error("外部程式載入失敗：" + def.src));
        } else {
          el.textContent = def.code;
          document.body.appendChild(el);
          resolve();
          return;
        }
        document.body.appendChild(el);
      });
    }

    for (const def of scripts) await runScript(def);

    if (typeof window.ReportGen === "undefined") {
      throw new Error("ReportGen 核心沒有成功載入");
    }
  } catch (err) {
    console.error(err);
    status.textContent = "載入失敗";
    errorBox.textContent = err.message + "\n\n把這個錯誤畫面截給我，我可以直接修正。";
  }
})();
