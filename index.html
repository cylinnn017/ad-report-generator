<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廣告成效報表產生器｜自訂版</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2F4F6;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#1F2733}
.box{width:min(560px,calc(100% - 40px));background:#fff;border:1px solid #DDE3E9;border-radius:12px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
h1{font-size:20px;margin:0 0 12px} p{font-size:14px;color:#5C6B7A;line-height:1.7;margin:0} .error{margin-top:16px;color:#C0392B;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<div class="box"><h1>廣告成效報表產生器</h1><p id="status">正在載入報表工具…</p><div id="error" class="error"></div></div>
<script>
(async function() {
  const SOURCE = "https://raw.githubusercontent.com/denny1463-afk/ad-report-generator/main/index.html";
  const PATCHES = [{"old": "      add(byAge, rec.age, rec);\n    }\n    return { byAdDate, byAdset, byGender, byAge };", "new": "      add(byAge, rec.age, rec);\n    }\n\n    // 年齡若含 Unknown／未知，將其數據併入一個有效年齡層，避免報表另外顯示 Unknown 列。\n    const ageUnknownKeys = [...byAge.keys()].filter(k => /^(unknown|未知)$/i.test(String(k).trim()));\n    if (ageUnknownKeys.length) {\n      const targetAgeKey = [...byAge.keys()]\n        .filter(k => !ageUnknownKeys.includes(k))\n        .sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true }))[0];\n      if (targetAgeKey) {\n        const target = byAge.get(targetAgeKey);\n        for (const uk of ageUnknownKeys) {\n          const src = byAge.get(uk);\n          if (!src) continue;\n          target.spend += src.spend;\n          for (const k in src.values) target.values[k] = (target.values[k] || 0) + src.values[k];\n          byAge.delete(uk);\n        }\n      }\n    }\n    return { byAdDate, byAdset, byGender, byAge };", "label": "年齡 Unknown 合併"}, {"old": "  const DKBLUE = 'FF1F497D', YELLOW = 'FFFFFF00', WHITE = 'FFFFFFFF', BLACK = 'FF000000', RED = 'FFFF0000', GREY = 'FF808080';", "new": "  const DKBLUE = 'FF44546A', YELLOW = 'FFFFFF00', WHITE = 'FFFFFFFF', BLACK = 'FF000000', RED = 'FFFF0000', GREY = 'FFE7E6E6';", "label": "報表主色與反灰色"}, {"old": "      ws.getColumn(cc).width = Math.max(10.5, Math.min(30, (colMax[cc] || 0) + 1.5));", "new": "      ws.getColumn(cc).width = Math.max(12.5, Math.min(32, (colMax[cc] || 0) + 2.5));", "label": "指標欄位間距"}, {"old": "<label class=\"ck\"><input type=\"checkbox\" id=\"secInterest\" checked>興趣群組(廣告組合)</label>", "new": "<label class=\"ck\"><input type=\"checkbox\" id=\"secInterest\" checked>受眾(廣告組合)</label>", "label": "網站受眾名稱"}, {"old": "      ['interest', '興趣群組', agg.byAdset, parsed.adsets],", "new": "      ['interest', '受眾', agg.byAdset, parsed.adsets],", "label": "報表受眾名稱"}, {"old": "    CPLC: { unitLabel: 'Link CPC', planLabel: '預計連結點擊次數', planExpr: 'B3/B5',\n      ratio: { top: '點擊率', num: 'linkClicks', den: 'impressions' },", "new": "    CPLC: { unitLabel: 'Link CPC', planLabel: '預計連結點擊次數', planExpr: 'B3/B5',\n      ratio: { top: 'LCTR', num: 'linkClicks', den: 'impressions' },", "label": "CPLC LCTR"}, {"old": "    set(rTot + 1, 1, { value: '總預算', font: { bold: true }, fill: fill(YELLOW), border: bd('medium', null, 'medium', 'thin') });\n    set(rTot + 1, 2, { formula: 'B3', numFmt: FMT.fee, font: { bold: true, color: { argb: RED } }, fill: fill(YELLOW), border: bd('medium', null, 'thin', 'medium'), h: 'center' });\n    set(rTot + 2, 1, { value: '總執行率', font: { bold: true }, fill: fill(YELLOW), border: bd('thin', 'medium', 'medium', 'thin') });\n    set(rTot + 2, 2, { formula: ifErr(`${cellFor('__fee', dStart)}${rTot}/B${rTot + 1}`), numFmt: FMT.ratio, font: { bold: true, color: { argb: RED } }, fill: fill(YELLOW), border: bd('thin', 'medium', 'thin', 'medium'), h: 'center' });", "new": "    // 總預算／總執行率：橫跨整個每日總表寬度，左側標題、右側數值\n    const rBudget = rTot + 1, rExec = rTot + 2;\n    for (let c = 1; c <= lastCol; c++) {\n      set(rBudget, c, {\n        fill: fill(YELLOW),\n        border: bd('medium', 'thin', c === 1 ? 'medium' : 'thin', c === lastCol ? 'medium' : 'thin')\n      });\n      set(rExec, c, {\n        fill: fill(YELLOW),\n        border: bd('thin', 'medium', c === 1 ? 'medium' : 'thin', c === lastCol ? 'medium' : 'thin')\n      });\n    }\n\n    set(rBudget, 1, {\n      value: '總預算',\n      font: { bold: true },\n      fill: fill(YELLOW),\n      border: bd('medium', 'thin', 'medium', 'thin'),\n      h: 'left'\n    });\n    set(rBudget, lastCol, {\n      formula: 'B3',\n      numFmt: FMT.fee,\n      font: { bold: true, color: { argb: RED } },\n      fill: fill(YELLOW),\n      border: bd('medium', 'thin', 'thin', 'medium'),\n      h: 'right'\n    });\n\n    set(rExec, 1, {\n      value: '總執行率',\n      font: { bold: true },\n      fill: fill(YELLOW),\n      border: bd('thin', 'medium', 'medium', 'thin'),\n      h: 'left'\n    });\n    set(rExec, lastCol, {\n      formula: ifErr(`${cellFor('__fee', dStart)}${rTot}/B3`),\n      numFmt: FMT.ratio,\n      font: { bold: true, color: { argb: RED } },\n      fill: fill(YELLOW),\n      border: bd('thin', 'medium', 'thin', 'medium'),\n      h: 'right'\n    });\n\n    if (lastCol > 2) {\n      ws.mergeCells(rBudget, 1, rBudget, lastCol - 1);\n      ws.mergeCells(rExec, 1, rExec, lastCol - 1);\n    }", "label": "總預算與總執行率"}];
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  try {
    const res = await fetch(SOURCE, {cache:"no-store"});
    if (!res.ok) throw new Error("無法讀取原始網站程式（HTTP " + res.status + "）");
    let s = await res.text();

    for (const p of PATCHES) {
      if (!s.includes(p.old)) throw new Error("找不到修改位置：" + p.label + "。原網站程式可能已更新。");
      s = s.replace(p.old, p.new);
    }

    s = s.replace("<title>廣告成效報表產生器</title>","<title>廣告成效報表產生器｜自訂版</title>");
    document.open();
    document.write(s);
    document.close();
  } catch (err) {
    console.error(err);
    status.textContent = "載入失敗";
    errorBox.textContent = err.message + "\n\n把這個錯誤畫面截給我，我可以直接修正。";
  }
})();
</script>
</body>
</html>
